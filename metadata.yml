Title: TransPharmer Pharmacophore-Informed Molecule Generation
Description: Generates new molecules that share the topological pharmacophore of
  an input reference compound while often changing its scaffold, useful for 
  scaffold hopping. A GPT-style SMILES decoder prompted with a 72-bit 
  pharmacophore fingerprint was trained on about 1.27 million GuacaMol 
  (ChEMBL-derived) molecules. Designs seeded with a PLK1 inhibitor were 
  synthesised, and three of four were sub-micromolar, the best at 5.1 nM. 
  Sampling is stochastic, only about 18% of raw samples were valid and unique in
  that run, and outputs often keep moieties of the reference.
