Identifier: eos92m1
Slug: transpharmer
Status: In progress
Title: TransPharmer Pharmacophore-Informed Molecule Generation
Description: Generates new molecules that share the topological pharmacophore of
  an input reference compound but often differ in scaffold, supporting scaffold 
  hopping. A GPT-style SMILES decoder conditioned on a 72-bit pharmacophore 
  fingerprint was trained on about 1.27 million GuacaMol (ChEMBL-derived) 
  molecules. In the original study, designs seeded with a PLK1 inhibitor were 
  synthesised and three of four showed sub-micromolar activity, the best at 5.1 
  nM. Sampling is stochastic, so outputs need filtering.
